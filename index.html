<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ứng Dụng Luyện Tiếng Trung HSK1</title>

  <!-- Thư viện đọc file Excel (.xlsx) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --primary: #00b900;
      --primary-dark: #008a00;
      --secondary: #1cb0f6;
      --danger: #ff4b4b;
      --gray-bg: #f7f7f7;
      --card-border: #e5e5e5;
      --text: #3c3c3c;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #f0f2f5; margin: 0; padding: 15px; color: var(--text); }
    .container { max-width: 650px; margin: 0 auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    
    header { text-align: center; border-bottom: 2px solid var(--card-border); padding-bottom: 15px; margin-bottom: 15px; }
    h1 { color: var(--primary); margin: 0 0 5px 0; font-size: 26px; }
    .subtitle { color: #666; font-size: 14px; font-weight: bold; }

    /* Nav Tabs cho 3 Phần Bài Tập */
    .section-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px 5px; border: 2px solid var(--card-border); background: var(--gray-bg); border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer; color: #555; text-align: center; transition: all 0.2s; }
    .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary-dark); }

    /* Bộ lọc bài học */
    .filter-card { background: #f8f9fa; border: 1px solid var(--card-border); border-radius: 12px; padding: 12px 15px; margin-bottom: 20px; }
    .filter-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    select, input[type="number"] { padding: 8px 10px; border-radius: 8px; border: 1px solid #ccc; font-weight: bold; outline: none; }
    input[type="number"] { width: 70px; text-align: center; }

    .status-bar { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 15px; margin-bottom: 15px; }
    .hearts { color: var(--danger); font-size: 18px; }
    
    .progress-container { width: 100%; background: #e5e5e5; height: 10px; border-radius: 5px; overflow: hidden; margin-bottom: 20px; }
    .progress-bar { width: 0%; height: 100%; background: var(--primary); transition: width 0.3s ease; }

    /* Flashcard / Question box */
    .question-card { background: var(--gray-bg); border: 2px solid var(--card-border); border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 20px; }
    .type-tag { display: inline-block; background: var(--secondary); color: white; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-bottom: 10px; }
    .question-text { font-size: 22px; font-weight: bold; color: #111; margin: 10px 0; }
    .sub-text { font-size: 15px; color: #666; }

    /* Options Grid */
    .options-grid { display: grid; gap: 10px; margin-bottom: 20px; }
    .btn-option { background: white; border: 2px solid var(--card-border); border-bottom-width: 4px; padding: 14px; border-radius: 12px; font-size: 17px; font-weight: bold; text-align: left; cursor: pointer; color: var(--text); }
    .btn-option:hover { background: #f1f1f1; }

    /* Sentence Puzzle */
    .word-pool, .sentence-target { display: flex; flex-wrap: wrap; gap: 8px; min-height: 55px; padding: 10px; border-radius: 12px; margin-bottom: 15px; }
    .sentence-target { background: #fff; border: 2px dashed #bbb; align-items: center; }
    .word-pool { background: var(--gray-bg); border: 1px solid var(--card-border); }
    
    .word-chip { background: white; border: 2px solid var(--card-border); border-bottom-width: 3px; padding: 8px 12px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
    .word-chip span.py { font-size: 11px; color: #666; font-weight: normal; }

    /* Typing Input */
    input[type="text"] { width: 100%; padding: 14px; font-size: 18px; border: 2px solid var(--card-border); border-radius: 12px; outline: none; margin-bottom: 15px; }
    input[type="text"]:focus { border-color: var(--secondary); }

    /* Buttons */
    .btn-main { width: 100%; background: var(--primary); color: white; border: none; border-bottom: 4px solid var(--primary-dark); padding: 14px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
    .btn-main:hover { background: #00a000; }
    .btn-secondary { background: var(--secondary); border-color: #0b93d5; }
    .btn-secondary:hover { background: #139ad9; }

    .hidden { display: none !important; }
    
    .feedback-box { padding: 15px; border-radius: 12px; margin-bottom: 15px; font-weight: bold; text-align: center; }
    .feedback-box.correct { background: #d7ffb8; color: #2b7000; border: 2px solid #a5ed6e; }
    .feedback-box.wrong { background: #ffdfe0; color: #ea2b2b; border: 2px solid #ffc1c1; }

    /* Bảng báo cáo phân tích */
    .report-card { background: #f8f9fa; border: 2px solid var(--card-border); border-radius: 16px; padding: 20px; margin: 15px 0; text-align: left; }
    .report-stat { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #ddd; font-weight: bold; }
    .wrong-item { background: #fff0f0; border-left: 4px solid var(--danger); padding: 8px 12px; margin-top: 6px; border-radius: 4px; font-size: 14px; }

    #loading { text-align: center; font-size: 18px; color: #666; padding: 40px 0; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>📚 Luyện Tiếng Trung HSK1</h1>
    <div class="subtitle">Chương Trình Ôn Tập Từ Vựng & Câu Từ</div>
  </header>

  <div id="loading">⏳ Đang tải dữ liệu từ file <b>HSK1_flashcards_theo_bai.xlsx</b>...</div>

  <div id="app" class="hidden">
    <!-- Chọn 1 trong 3 Phần bài tập -->
    <div class="section-tabs">
      <button class="tab-btn active" id="tab1" onclick="switchSection(1)">1. Ôn Từ Vựng</button>
      <button class="tab-btn" id="tab2" onclick="switchSection(2)">2. Sắp Xếp Câu</button>
      <button class="tab-btn" id="tab3" onclick="switchSection(3)">3. Luyện Gõ Câu</button>
    </div>

    <!-- Tùy chọn bài học linh hoạt -->
    <div class="filter-card">
      <div style="font-weight: bold; margin-bottom: 5px;">🎯 Chọn bài học:</div>
      <div class="filter-row">
        <select id="modeSelect" onchange="handleModeChange()">
          <option value="single">Theo 1 bài cụ thể</option>
          <option value="range">Tùy chọn dải bài (Ví dụ: 1 đến 2)</option>
          <option value="all">Tất cả bài (Bài 1 - 30)</option>
        </select>

        <!-- Khung chọn 1 bài -->
        <span id="singleSelectBox">
          <select id="singleLessonSelect" onchange="startRound()"></select>
        </span>

        <!-- Khung chọn tùy chỉnh dải bài -->
        <span id="rangeSelectBox" class="hidden">
          Từ Bài <input type="number" id="startLesson" value="1" min="1" max="30">
          đến Bài <input type="number" id="endLesson" value="2" min="1" max="30">
          <button style="padding: 7px 12px; border-radius: 8px; background: var(--secondary); color: white; border: none; font-weight: bold; cursor: pointer;" onclick="startRound()">Áp dụng</button>
        </span>
      </div>
    </div>

    <div class="status-bar">
      <div>Đang luyện: <span id="currentModeLabel" style="color: var(--primary);">Bài 1</span></div>
      <div class="hearts">❤ <span id="heartCount">5</span></div>
    </div>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div id="quizArea">
      <div class="question-card">
        <span class="type-tag" id="typeTag">Loại bài tập</span>
        <div class="question-text" id="questionTitle">Nội dung</div>
        <div class="sub-text" id="questionSub">Hướng dẫn</div>
      </div>

      <div id="interactiveArea"></div>
      <div id="feedback" class="feedback-box hidden"></div>
      <button class="btn-main" id="actionBtn" onclick="handleAction()">Kiểm tra</button>
    </div>
  </div>
</div>

<script>
  let rawData = [];
  let currentQueue = [];
  let mistakeQueue = [];
  let recordHistory = []; 
  let currentItem = null;
  let activeSection = 1; 
  let hearts = 5;
  let totalInRound = 0;
  let completedInRound = 0;
  let isAnswered = false;

  // HÀM LOẠI BỎ TRIỆT ĐỂ MỌI DẤU CÂU (Bao gồm . , ! ? ... và dấu câu Trung Quốc)
  function cleanPunctuation(str) {
    if (!str) return '';
    // Xóa tất cả các loại dấu chấm, ba chấm, phẩy, hỏi, chấm cảm...
    return str.replace(/[。？！，、；：""''（）《》,.?!;:…\-\_\s]/g, '').trim();
  }

  // Web Audio Synth
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'correct') {
      osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
      osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.35);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, audioCtx.currentTime);
      osc.frequency.setValueAtTime(160, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    }
  }

  // Tải file Excel
  window.onload = function() {
    fetch('HSK1_flashcards_theo_bai.xlsx')
      .then(res => {
        if (!res.ok) throw new Error("Lỗi tải file");
        return res.arrayBuffer();
      })
      .then(buffer => {
        const wb = XLSX.read(buffer, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet);
        
        rawData = json.map(r => ({
          lessonNum: parseInt(String(r['Bài'] || '').replace(/\D/g, '')) || 1,
          lessonStr: String(r['Bài'] || '').trim(),
          vocab: String(r['Từ'] || '').trim(),
          pinyin: String(r['Pinyin'] || '').trim(),
          meaning: String(r['Nghĩa tiếng Việt'] || '').trim(),
          example_vi: r['Ví dụ tiếng Việt'] ? String(r['Ví dụ tiếng Việt']).trim() : '',
          example_cn: r['Ví dụ tiếng Trung'] ? String(r['Ví dụ tiếng Trung']).trim() : '',
          example_pinyin: r['Ví dụ pinyin'] ? String(r['Ví dụ pinyin']).trim() : ''
        })).filter(item => item.vocab && item.meaning);

        populateSingleLessons();
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        startRound();
      })
      .catch(err => {
        document.getElementById('loading').innerHTML = `
          <div style="color:red; text-align:left;">
            ⚠️ <b>Chưa tìm thấy file HSK1_flashcards_theo_bai.xlsx!</b><br>
            Hãy chắc chắn bạn đã upload file Excel tên <code>HSK1_flashcards_theo_bai.xlsx</code> lên GitHub.
          </div>`;
      });
  };

  function populateSingleLessons() {
    const select = document.getElementById('singleLessonSelect');
    select.innerHTML = '';
    const lessons = [...new Set(rawData.map(i => i.lessonNum))].sort((a,b)=>a-b);
    lessons.forEach(num => {
      select.innerHTML += `<option value="${num}">Bài ${num}</option>`;
    });
  }

  function switchSection(sec) {
    activeSection = sec;
    document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
      if (idx + 1 === sec) btn.classList.add('active');
      else btn.classList.remove('active');
    });
    resetQuizAreaUI();
    startRound();
  }

  function handleModeChange() {
    const mode = document.getElementById('modeSelect').value;
    document.getElementById('singleSelectBox').className = mode === 'single' ? '' : 'hidden';
    document.getElementById('rangeSelectBox').className = mode === 'range' ? '' : 'hidden';
    resetQuizAreaUI();
    startRound();
  }

  function resetQuizAreaUI() {
    document.getElementById('quizArea').innerHTML = `
      <div class="question-card">
        <span class="type-tag" id="typeTag">Loại bài tập</span>
        <div class="question-text" id="questionTitle">Nội dung</div>
        <div class="sub-text" id="questionSub">Hướng dẫn</div>
      </div>
      <div id="interactiveArea"></div>
      <div id="feedback" class="feedback-box hidden"></div>
      <button class="btn-main" id="actionBtn" onclick="handleAction()">Kiểm tra</button>
    `;
  }

  function startRound() {
    const mode = document.getElementById('modeSelect').value;
    let filtered = [];
    let label = '';

    if (mode === 'single') {
      const selectedNum = parseInt(document.getElementById('singleLessonSelect').value);
      filtered = rawData.filter(i => i.lessonNum === selectedNum);
      label = `Bài ${selectedNum}`;
    } else if (mode === 'range') {
      const start = parseInt(document.getElementById('startLesson').value) || 1;
      const end = parseInt(document.getElementById('endLesson').value) || 1;
      filtered = rawData.filter(i => i.lessonNum >= start && i.lessonNum <= end);
      label = `Bài ${start} ➔ Bài ${end}`;
    } else {
      filtered = [...rawData];
      label = `Tất cả 30 Bài`;
    }

    if (activeSection === 2 || activeSection === 3) {
      filtered = filtered.filter(i => i.example_cn && i.example_vi);
    }

    document.getElementById('currentModeLabel').innerText = label;

    if (filtered.length === 0) {
      alert("⚠ Không tìm thấy dữ liệu bài tập thích hợp cho phần này!");
      return;
    }

    currentQueue = filtered.sort(() => Math.random() - 0.5);
    mistakeQueue = [];
    recordHistory = [];
    totalInRound = currentQueue.length;
    completedInRound = 0;
    hearts = 5;
    document.getElementById('heartCount').innerText = hearts;
    updateProgress();
    nextQuestion();
  }

  function updateProgress() {
    const pct = totalInRound > 0 ? (completedInRound / totalInRound) * 100 : 0;
    document.getElementById('progressBar').style.width = `${Math.min(pct, 100)}%`;
  }

  function nextQuestion() {
    isAnswered = false;
    selectedOption = null;
    const feedback = document.getElementById('feedback');
    if (feedback) feedback.className = 'feedback-box hidden';
    
    const actionBtn = document.getElementById('actionBtn');
    if (actionBtn) actionBtn.innerText = 'Kiểm tra';

    if (currentQueue.length === 0) {
      showSummaryReport();
      return;
    }

    currentItem = currentQueue.shift();
    renderQuiz();
  }

  function renderQuiz() {
    const area = document.getElementById('interactiveArea');
    if (!area) return;
    area.innerHTML = '';

    if (activeSection === 1) {
      // PHẦN 1: ÔN TỪ VỰNG
      const isCnToVi = Math.random() > 0.5;
      document.getElementById('typeTag').innerText = "PHẦN 1: ÔN TẬP TỪ VỰNG";

      if (isCnToVi) {
        document.getElementById('questionTitle').innerText = `${currentItem.vocab} (${currentItem.pinyin})`;
        document.getElementById('questionSub').innerText = "Chọn nghĩa tiếng Việt tương ứng:";
      } else {
        document.getElementById('questionTitle').innerText = currentItem.meaning;
        document.getElementById('questionSub').innerText = "Chọn từ tiếng Trung tương ứng:";
      }

      let distractors = rawData.filter(i => i.vocab !== currentItem.vocab).sort(() => Math.random() - 0.5).slice(0, 2);
      let options = [currentItem, ...distractors].sort(() => Math.random() - 0.5);

      let grid = document.createElement('div');
      grid.className = 'options-grid';

      options.forEach(opt => {
        let btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = isCnToVi ? opt.meaning : `${opt.vocab} (${opt.pinyin})`;
        btn.onclick = () => selectOption(btn, opt.vocab === currentItem.vocab);
        grid.appendChild(btn);
      });
      area.appendChild(grid);

    } else if (activeSection === 2) {
      // PHẦN 2: SẮP XẾP CÂU
      document.getElementById('typeTag').innerText = "PHẦN 2: SẮP XẾP CÂU";
      document.getElementById('questionTitle').innerText = currentItem.example_vi;
      document.getElementById('questionSub').innerText = "Bấm chọn từ để ghép thành câu tiếng Trung đúng:";

      // LÀM SẠCH DẤU CÂU NGAY TRONG CÁC THẺ (CHIP)
      let cleanCn = cleanPunctuation(currentItem.example_cn);
      let cnWords = cleanCn.split('');
      
      // Làm sạch pinyin tương ứng
      let cleanPy = currentItem.example_pinyin ? cleanPunctuation(currentItem.example_pinyin) : '';
      let pyWords = cleanPy ? cleanPy.split(' ') : [];

      let chips = cnWords.map((char, idx) => ({
        hanzi: char,
        pinyin: pyWords[idx] || ''
      })).sort(() => Math.random() - 0.5);

      area.innerHTML = `
        <div class="sentence-target" id="targetArea"></div>
        <div class="word-pool" id="poolArea"></div>
      `;

      const poolArea = document.getElementById('poolArea');
      const targetArea = document.getElementById('targetArea');

      chips.forEach((c) => {
        let chip = document.createElement('div');
        chip.className = 'word-chip';
        chip.innerHTML = `${c.hanzi} ${c.pinyin ? `<span class="py">${c.pinyin}</span>` : ''}`;
        chip.onclick = () => {
          if (chip.parentElement.id === 'poolArea') targetArea.appendChild(chip);
          else poolArea.appendChild(chip);
        };
        poolArea.appendChild(chip);
      });

    } else if (activeSection === 3) {
      // PHẦN 3: LUYỆN GÕ CÂU
      document.getElementById('typeTag').innerText = "PHẦN 3: LUYỆN GÕ CÂU";
      document.getElementById('questionTitle').innerText = currentItem.example_vi;
      document.getElementById('questionSub').innerText = "Gõ câu tiếng Trung bằng bàn phím Pinyin:";

      area.innerHTML = `
        <input type="text" id="typeInput" placeholder="Gõ chữ Hán vào đây..." autocomplete="off">
      `;
    }
  }

  let selectedOption = null;
  let isOptionCorrect = false;

  function selectOption(btn, isCorrect) {
    document.querySelectorAll('.btn-option').forEach(b => b.style.borderColor = 'var(--card-border)');
    btn.style.borderColor = 'var(--secondary)';
    selectedOption = btn;
    isOptionCorrect = isCorrect;
  }

  function handleAction() {
    if (isAnswered) {
      completedInRound++;
      updateProgress();
      nextQuestion();
      return;
    }

    let isCorrect = false;
    let correctAnswerText = '';

    if (activeSection === 1) {
      if (!selectedOption) { alert("Vui lòng chọn 1 đáp án!"); return; }
      isCorrect = isOptionCorrect;
      correctAnswerText = `${currentItem.vocab} (${currentItem.pinyin}) : ${currentItem.meaning}`;
    } else if (activeSection === 2) {
      const userSentence = Array.from(document.getElementById('targetArea').children)
        .map(el => el.childNodes[0].textContent.trim()).join('');
      
      // So sánh sau khi đã làm sạch 100% dấu câu
      isCorrect = (cleanPunctuation(userSentence) === cleanPunctuation(currentItem.example_cn));
      correctAnswerText = `${currentItem.example_cn} (${currentItem.example_pinyin})`;
    } else if (activeSection === 3) {
      const val = document.getElementById('typeInput').value;
      
      // So sánh sau khi đã làm sạch 100% dấu câu
      isCorrect = (cleanPunctuation(val) === cleanPunctuation(currentItem.example_cn));
      correctAnswerText = currentItem.example_cn;
    }

    recordHistory.push({
      item: currentItem,
      isCorrect: isCorrect,
      correctText: correctAnswerText
    });

    const feedback = document.getElementById('feedback');
    feedback.classList.remove('hidden');

    if (isCorrect) {
      playSound('correct');
      feedback.className = 'feedback-box correct';
      feedback.innerHTML = '🎉 Chính xác! Bạn làm xuất sắc lắm!';
    } else {
      playSound('wrong');
      hearts--;
      document.getElementById('heartCount').innerText = Math.max(0, hearts);
      feedback.className = 'feedback-box wrong';
      feedback.innerHTML = `❌ Chưa chính xác!<br><small>Đáp án đúng: <b>${correctAnswerText}</b></small>`;
      mistakeQueue.push(currentItem);
    }

    isAnswered = true;
    document.getElementById('actionBtn').innerText = 'Câu tiếp theo ➡️';
  }

  function showSummaryReport() {
    const totalQuestions = recordHistory.length;
    const correctCount = recordHistory.filter(r => r.isCorrect).length;
    const wrongList = recordHistory.filter(r => !r.isCorrect);
    const accuracy = totalQuestions > 0 ? Math.round((correctCount / totalQuestions) * 100) : 0;

    let wrongDetailsHtml = '';
    if (wrongList.length > 0) {
      wrongDetailsHtml = `<div style="margin-top:15px; font-weight:bold; color: var(--danger);">Các câu/từ cần ôn lại:</div>`;
      wrongList.forEach(w => {
        wrongDetailsHtml += `
          <div class="wrong-item">
            📌 <b>${w.item.vocab || w.item.example_vi}</b><br>
            Đáp án đúng: <i>${w.correctText}</i>
          </div>
        `;
      });
    } else {
      wrongDetailsHtml = `<div style="margin-top:15px; color: var(--primary); font-weight:bold;">🌟 Tuyệt vời! Bạn không làm sai câu nào cả!</div>`;
    }

    const sectionName = activeSection === 1 ? 'Ôn Từ Vựng' : (activeSection === 2 ? 'Sắp Xếp Câu' : 'Luyện Gõ Câu');

    document.getElementById('quizArea').innerHTML = `
      <div style="text-align:center;">
        <div style="font-size:50px; margin-bottom: 10px;">🏆</div>
        <h2 style="margin:0 0 10px 0; color: var(--primary);">KẾT QUẢ CỦA BẠN</h2>
        <div style="color:#666; font-size:14px;">Phần: <b>${sectionName}</b></div>

        <div class="report-card">
          <div class="report-stat"><span>Tổng số câu hỏi:</span> <span>${totalQuestions}</span></div>
          <div class="report-stat"><span>Số câu làm đúng:</span> <span style="color: var(--primary);">${correctCount}</span></div>
          <div class="report-stat"><span>Số câu làm sai:</span> <span style="color: var(--danger);">${wrongList.length}</span></div>
          <div class="report-stat" style="border-bottom:none; font-size: 18px; margin-top: 5px;">
            <span>Tỷ lệ chính xác:</span> 
            <span style="color: ${accuracy >= 80 ? 'var(--primary)' : 'orange'};">${accuracy}%</span>
          </div>
          ${wrongDetailsHtml}
        </div>

        ${mistakeQueue.length > 0 ? `
          <button class="btn-main btn-secondary" onclick="retryMistakes()">🔁 Ôn lại ${mistakeQueue.length} câu chưa đúng</button>
        ` : ''}
        
        <button class="btn-main" onclick="resetQuizAreaUI(); startRound();">▶️ Tiếp tục ôn luyện bài này</button>
        <button class="btn-main" style="background: #666; border-color: #444;" onclick="location.reload()">🏁 Kết thúc / Chọn bài khác</button>
      </div>
    `;
  }

  function retryMistakes() {
    currentQueue = [...mistakeQueue];
    mistakeQueue = [];
    recordHistory = [];
    totalInRound = currentQueue.length;
    completedInRound = 0;
    resetQuizAreaUI();
    updateProgress();
    nextQuestion();
  }
</script>

</body>
</html>
