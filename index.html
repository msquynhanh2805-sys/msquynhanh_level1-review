<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luyện Tiếng Trung Duolingo - HSK1</title>

  <!-- Thư viện đọc file Excel (.xlsx) trực tiếp trên trình duyệt -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --primary: #58cc02;
      --primary-dark: #46a302;
      --secondary: #1cb0f6;
      --danger: #ff4b4b;
      --gray-bg: #f7f7f7;
      --card-border: #e5e5e5;
      --text: #3c3c3c;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #f0f2f5; margin: 0; padding: 15px; color: var(--text); }
    .container { max-width: 650px; margin: 0 auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    
    header { text-align: center; border-bottom: 2px solid var(--card-border); padding-bottom: 15px; margin-bottom: 20px; }
    h1 { color: var(--primary); margin: 0 0 10px 0; font-size: 26px; }
    
    .status-bar { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 12px 18px; border-radius: 12px; font-weight: bold; font-size: 15px; margin-bottom: 20px; border: 1px solid var(--card-border); }
    .hearts { color: var(--danger); font-size: 18px; }
    
    .progress-container { width: 100%; background: #e5e5e5; height: 12px; border-radius: 6px; overflow: hidden; margin-bottom: 20px; }
    .progress-bar { width: 0%; height: 100%; background: var(--primary); transition: width 0.3s ease; }

    select { padding: 8px 12px; border-radius: 8px; border: 1px solid #ccc; font-weight: bold; color: var(--text); cursor: pointer; outline: none; }

    /* Flashcard / Question box */
    .question-card { background: var(--gray-bg); border: 2px solid var(--card-border); border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 20px; position: relative; }
    .type-tag { display: inline-block; background: var(--secondary); color: white; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-bottom: 10px; }
    .question-text { font-size: 22px; font-weight: bold; color: #111; margin: 10px 0; }
    .sub-text { font-size: 15px; color: #666; }

    /* Options / Buttons */
    .options-grid { display: grid; gap: 12px; margin-bottom: 20px; }
    .btn-option { background: white; border: 2px solid var(--card-border); border-bottom-width: 4px; padding: 14px; border-radius: 12px; font-size: 17px; font-weight: bold; text-align: left; cursor: pointer; transition: all 0.1s; color: var(--text); }
    .btn-option:hover { background: #f1f1f1; border-color: #ccc; }
    .btn-option:active { transform: translateY(2px); border-bottom-width: 2px; }

    /* Sentence Puzzle */
    .word-pool, .sentence-target { display: flex; flex-wrap: wrap; gap: 8px; min-height: 55px; padding: 10px; border-radius: 12px; margin-bottom: 15px; }
    .sentence-target { background: #fff; border: 2px dashed #bbb; align-items: center; }
    .word-pool { background: var(--gray-bg); border: 1px solid var(--card-border); }
    
    .word-chip { background: white; border: 2px solid var(--card-border); border-bottom-width: 3px; padding: 8px 14px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
    .word-chip span.py { font-size: 11px; color: #666; font-weight: normal; }

    /* Typing Input */
    input[type="text"] { width: 100%; padding: 14px; font-size: 18px; border: 2px solid var(--card-border); border-radius: 12px; outline: none; margin-bottom: 15px; }
    input[type="text"]:focus { border-color: var(--secondary); }

    /* Action buttons */
    .btn-main { width: 100%; background: var(--primary); color: white; border: none; border-bottom: 4px solid var(--primary-dark); padding: 14px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; }
    .btn-main:hover { background: #4ebd02; }
    .btn-main:active { transform: translateY(2px); border-bottom-width: 2px; }

    .hidden { display: none !important; }
    
    /* Result Popup */
    .feedback-box { padding: 15px; border-radius: 12px; margin-bottom: 15px; font-weight: bold; text-align: center; }
    .feedback-box.correct { background: #d7ffb8; color: #2b7000; border: 2px solid #a5ed6e; }
    .feedback-box.wrong { background: #ffdfe0; color: #ea2b2b; border: 2px solid #ffc1c1; }

    #loading { text-align: center; font-size: 18px; color: #666; padding: 40px 0; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🐼 HSK1 Duolingo</h1>
    <div>Luyện Từ Vựng - Sắp Xếp Câu - Gõ Chữ Hán</div>
  </header>

  <div id="loading">⏳ Đang tải dữ liệu từ file <b>HSK1_flashcards_theo_bai.xlsx</b>...</div>

  <div id="app" class="hidden">
    <div class="status-bar">
      <div>
        Chế độ: 
        <select id="modeSelect" onchange="changeMode()">
          <!-- Tự động điền bài từ Excel -->
        </select>
      </div>
      <div class="hearts">❤ <span id="heartCount">5</span></div>
    </div>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div id="quizArea">
      <!-- Thẻ câu hỏi -->
      <div class="question-card">
        <span class="type-tag" id="typeTag">Loại bài tập</span>
        <div class="question-text" id="questionTitle">Nội dung câu hỏi</div>
        <div class="sub-text" id="questionSub">Hướng dẫn</div>
      </div>

      <!-- Khu vực làm bài -->
      <div id="interactiveArea"></div>

      <!-- Khung phản hồi Đúng/Sai -->
      <div id="feedback" class="feedback-box hidden"></div>

      <!-- Nút Kiểm tra / Câu tiếp theo -->
      <button class="btn-main" id="actionBtn" onclick="handleAction()">Kiểm tra</button>
    </div>
  </div>
</div>

<script>
  let rawData = [];
  let currentQueue = [];
  let mistakeQueue = [];
  let currentItem = null;
  let currentType = 1; // 1: Ôn từ, 2: Xếp câu, 3: Luyện gõ
  let hearts = 5;
  let totalInRound = 0;
  let completedInRound = 0;
  let isAnswered = false;

  // Web Audio Synthesizer (Tạo tiếng Ting / Bíp)
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'correct') {
      osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
      osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1); // A5
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.35);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, audioCtx.currentTime);
      osc.frequency.setValueAtTime(160, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    }
  }

  // 1. Tải file Excel HSK1_flashcards_theo_bai.xlsx từ GitHub
  window.onload = function() {
    fetch('HSK1_flashcards_theo_bai.xlsx')
      .then(res => {
        if (!res.ok) throw new Error("Không tìm thấy file Excel");
        return res.arrayBuffer();
      })
      .then(buffer => {
        const wb = XLSX.read(buffer, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet);
        
        // Chuẩn hóa tên cột
        rawData = json.map(r => ({
          lesson: String(r['Bài'] || '').trim(),
          vocab: String(r['Từ'] || '').trim(),
          pinyin: String(r['Pinyin'] || '').trim(),
          meaning: String(r['Nghĩa tiếng Việt'] || '').trim(),
          example_vi: r['Ví dụ tiếng Việt'] ? String(r['Ví dụ tiếng Việt']).trim() : '',
          example_cn: r['Ví dụ tiếng Trung'] ? String(r['Ví dụ tiếng Trung']).trim() : '',
          example_pinyin: r['Ví dụ pinyin'] ? String(r['Ví dụ pinyin']).trim() : ''
        })).filter(item => item.vocab && item.meaning);

        initModeOptions();
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        loadSavedProgress();
        startRound();
      })
      .catch(err => {
        document.getElementById('loading').innerHTML = `
          <div style="color:red; text-align:left;">
            ⚠️ <b>Không tìm thấy file HSK1_flashcards_theo_bai.xlsx!</b><br><br>
            Hãy chắc chắn bạn đã <b>Upload</b> file Excel tên chính xác <code>HSK1_flashcards_theo_bai.xlsx</code> lên cùng thư mục với file <code>index.html</code> này trên GitHub.
          </div>`;
      });
  };

  // 2. Khởi tạo danh sách chế độ chọn bài
  function initModeOptions() {
    const select = document.getElementById('modeSelect');
    select.innerHTML = '';

    // Danh sách các bài
    const lessons = [...new Set(rawData.map(i => i.lesson))];
    
    // Tùy chọn 5 bài một
    select.innerHTML += `<option value="all">🌐 Tổng hợp tất cả bài</option>`;
    select.innerHTML += `<option value="group_1_5">📚 Bài 1 đến Bài 5</option>`;
    select.innerHTML += `<option value="group_6_10">📚 Bài 6 đến Bài 10</option>`;
    select.innerHTML += `<option value="group_11_15">📚 Bài 11 đến Bài 15</option>`;
    select.innerHTML += `<option value="group_16_20">📚 Bài 16 đến Bài 20</option>`;
    select.innerHTML += `<option value="group_21_25">📚 Bài 21 đến Bài 25</option>`;
    select.innerHTML += `<option value="group_26_30">📚 Bài 26 đến Bài 30</option>`;

    lessons.forEach(l => {
      select.innerHTML += `<option value="${l}">📖 ${l}</option>`;
    });
  }

  function changeMode() {
    localStorage.setItem('hsk1_selected_mode', document.getElementById('modeSelect').value);
    startRound();
  }

  function loadSavedProgress() {
    const savedMode = localStorage.getItem('hsk1_selected_mode');
    if (savedMode) document.getElementById('modeSelect').value = savedMode;
  }

  // 3. Bắt đầu lượt học
  function startRound() {
    const mode = document.getElementById('modeSelect').value;
    let filtered = [];

    if (mode === 'all') {
      filtered = [...rawData];
    } else if (mode.startsWith('group_')) {
      const parts = mode.split('_');
      const start = parseInt(parts[1]);
      const end = parseInt(parts[2]);
      filtered = rawData.filter(i => {
        const num = parseInt(i.lesson.replace(/\D/g, ''));
        return num >= start && num <= end;
      });
    } else {
      filtered = rawData.filter(i => i.lesson === mode);
    }

    // Xáo trộn danh sách câu hỏi
    currentQueue = filtered.sort(() => Math.random() - 0.5);
    mistakeQueue = [];
    totalInRound = currentQueue.length;
    completedInRound = 0;
    hearts = 5;
    document.getElementById('heartCount').innerText = hearts;
    updateProgress();
    nextQuestion();
  }

  function updateProgress() {
    const pct = totalInRound > 0 ? (completedInRound / totalInRound) * 100 : 0;
    document.getElementById('progressBar').style.width = `${Math.min(pct, 100)}%`;
  }

  // 4. Sinh bài tập tiếp theo
  function nextQuestion() {
    isAnswered = false;
    document.getElementById('feedback').className = 'feedback-box hidden';
    document.getElementById('actionBtn').innerText = 'Kiểm tra';

    if (currentQueue.length === 0) {
      if (mistakeQueue.length > 0) {
        alert("🔄 Bây giờ chúng ta sẽ luyện tập lại các câu bạn làm chưa đúng nhé!");
        currentQueue = [...mistakeQueue];
        mistakeQueue = [];
        nextQuestion();
        return;
      }

      // Hoàn thành xuất sắc
      document.getElementById('quizArea').innerHTML = `
        <div style="text-align:center; padding: 30px 10px;">
          <div style="font-size:60px;">🎉</div>
          <h2>XUẤT SẮC! BẠN ĐÃ HOÀN THÀNH BÀI HỌC!</h2>
          <p>Bạn đã ghi nhớ rất tốt các từ vựng và câu HSK1.</p>
          <button class="btn-main" onclick="location.reload()">Học bài khác</button>
        </div>
      `;
      return;
    }

    currentItem = currentQueue.shift();

    // Quyết định dạng bài tập (1: Ôn từ, 2: Sắp xếp câu, 3: Luyện gõ)
    // Nếu item không có câu ví dụ thì bắt buộc chọn dạng 1 (Ôn từ)
    if (!currentItem.example_cn || !currentItem.example_vi) {
      currentType = 1;
    } else {
      currentType = Math.floor(Math.random() * 3) + 1;
    }

    renderQuiz();
  }

  // 5. Hiển thị giao diện bài tập
  function renderQuiz() {
    const area = document.getElementById('interactiveArea');
    area.innerHTML = '';

    if (currentType === 1) {
      // PART 1: ÔN TỪ VỰNG (2 Chiều)
      const isCnToVi = Math.random() > 0.5;
      document.getElementById('typeTag').innerText = "PHẦN 1: ÔN TẬP TỪ VỰNG";

      if (isCnToVi) {
        document.getElementById('questionTitle').innerText = `${currentItem.vocab} (${currentItem.pinyin})`;
        document.getElementById('questionSub').innerText = "Chọn nghĩa tiếng Việt chính xác:";
      } else {
        document.getElementById('questionTitle').innerText = currentItem.meaning;
        document.getElementById('questionSub').innerText = "Chọn từ tiếng Trung tương ứng:";
      }

      // Tạo 3 phương án lựa chọn
      let distractors = rawData.filter(i => i.vocab !== currentItem.vocab).sort(() => Math.random() - 0.5).slice(0, 2);
      let options = [currentItem, ...distractors].sort(() => Math.random() - 0.5);

      let grid = document.createElement('div');
      grid.className = 'options-grid';

      options.forEach(opt => {
        let btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = isCnToVi ? opt.meaning : `${opt.vocab} (${opt.pinyin})`;
        btn.onclick = () => selectOption(btn, opt.vocab === currentItem.vocab);
        grid.appendChild(btn);
      });
      area.appendChild(grid);

    } else if (currentType === 2) {
      // PART 2: SẮP XẾP CÂU (Kèm Pinyin)
      document.getElementById('typeTag').innerText = "PHẦN 2: SẮP XẾP CÂU";
      document.getElementById('questionTitle').innerText = currentItem.example_vi;
      document.getElementById('questionSub').innerText = "Bấm các khối từ để xếp thành câu tiếng Trung đúng:";

      // Tách từ (đơn giản theo từng ký tự/từ)
      let cnWords = currentItem.example_cn.replace(/[。？！，,.?!]/g, '').split('');
      let pyWords = currentItem.example_pinyin.split(' ');

      // Tạo danh sách chip từ
      let chips = cnWords.map((char, idx) => ({
        hanzi: char,
        pinyin: pyWords[idx] || ''
      })).sort(() => Math.random() - 0.5);

      area.innerHTML = `
        <div class="sentence-target" id="targetArea"></div>
        <div class="word-pool" id="poolArea"></div>
      `;

      const poolArea = document.getElementById('poolArea');
      const targetArea = document.getElementById('targetArea');

      chips.forEach((c, i) => {
        let chip = document.createElement('div');
        chip.className = 'word-chip';
        chip.id = `chip_${i}`;
        chip.innerHTML = `${c.hanzi} <span class="py">${c.pinyin}</span>`;
        chip.onclick = () => {
          if (chip.parentElement.id === 'poolArea') {
            targetArea.appendChild(chip);
          } else {
            poolArea.appendChild(chip);
          }
        };
        poolArea.appendChild(chip);
      });

    } else if (currentType === 3) {
      // PART 3: LUYỆN GÕ CHỮ HÁN
      document.getElementById('typeTag').innerText = "PHẦN 3: LUYỆN GÕ CHỮ HÁN";
      document.getElementById('questionTitle').innerText = currentItem.example_vi || currentItem.meaning;
      document.getElementById('questionSub').innerText = "Sử dụng bàn phím Pinyin để gõ lại toàn bộ câu/từ tiếng Trung:";

      area.innerHTML = `
        <input type="text" id="typeInput" placeholder="Gõ Chữ Hán vào đây..." autocomplete="off">
      `;
    }
  }

  let selectedOption = null;
  let isOptionCorrect = false;

  function selectOption(btn, isCorrect) {
    document.querySelectorAll('.btn-option').forEach(b => b.style.borderColor = 'var(--card-border)');
    btn.style.borderColor = 'var(--secondary)';
    selectedOption = btn;
    isOptionCorrect = isCorrect;
  }

  // 6. Xử lý khi bấm nút "KIỂM TRA" / "CÂU TIẾP THEO"
  function handleAction() {
    if (isAnswered) {
      completedInRound++;
      updateProgress();
      nextQuestion();
      return;
    }

    let isCorrect = false;
    let correctAnswerText = '';

    if (currentType === 1) {
      if (!selectedOption) { alert("Vui lòng chọn 1 đáp án!"); return; }
      isCorrect = isOptionCorrect;
      correctAnswerText = `${currentItem.vocab} (${currentItem.pinyin}) : ${currentItem.meaning}`;
    } else if (currentType === 2) {
      const userSentence = Array.from(document.getElementById('targetArea').children)
        .map(el => el.childNodes[0].textContent.trim()).join('');
      const cleanTarget = currentItem.example_cn.replace(/[。？！，,.?!]/g, '').trim();
      isCorrect = (userSentence === cleanTarget);
      correctAnswerText = `${currentItem.example_cn} (${currentItem.example_pinyin})`;
    } else if (currentType === 3) {
      const val = document.getElementById('typeInput').value.trim().replace(/[。？！，,.?!]/g, '');
      const target = (currentItem.example_cn || currentItem.vocab).replace(/[。？！，,.?!]/g, '').trim();
      isCorrect = (val === target);
      correctAnswerText = currentItem.example_cn || currentItem.vocab;
    }

    const feedback = document.getElementById('feedback');
    feedback.classList.remove('hidden');

    if (isCorrect) {
      playSound('correct');
      feedback.className = 'feedback-box correct';
      feedback.innerHTML = '🎉 Chính xác! Bạn làm tốt lắm!';
    } else {
      playSound('wrong');
      hearts--;
      document.getElementById('heartCount').innerText = Math.max(0, hearts);
      feedback.className = 'feedback-box wrong';
      feedback.innerHTML = `❌ Chưa chính xác!<br><small>Đáp án đúng: <b>${correctAnswerText}</b></small>`;
      mistakeQueue.push(currentItem); // Gom vào danh sách sai để luyện lại
    }

    isAnswered = true;
    document.getElementById('actionBtn').innerText = 'Câu tiếp theo ➡️';
  }
</script>

</body>
</html>
